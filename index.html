<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wisdom Wise — a personal catalog</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500;600&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet">
<style>
  :root{
    --manila: #E4D8B8;
    --manila-dark: #CBB988;
    --paper: #FAF6EC;
    --card: #FFFDF7;
    --ink: #2A2621;
    --ink-soft: #5B5548;
    --shelf-green: #2F4A3C;
    --shelf-green-dark: #22362B;
    --rust: #B4502F;
    --line: #D8CBA6;
    --hole: #EFE9D4;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:var(--paper);
    background-image:
      radial-gradient(circle at 1px 1px, rgba(0,0,0,0.035) 1px, transparent 0);
    background-size: 22px 22px;
    color:var(--ink);
    font-family:'Lora', serif;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;}

  /* ---------- Header: drawer label plate ---------- */
  header.top{
    background:var(--shelf-green);
    color:#EFE9D4;
    padding:38px 24px 26px;
    position:relative;
    border-bottom:6px solid var(--shelf-green-dark);
  }
  .plate-wrap{
    max-width:920px;
    margin:0 auto;
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    gap:20px;
    flex-wrap:wrap;
  }
  .plate{
    display:inline-block;
    padding:4px 14px;
    border:1.5px solid #EFE9D4;
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    letter-spacing:.14em;
    text-transform:uppercase;
    margin-bottom:14px;
    color:#EFE9D4;
    opacity:.85;
  }
  h1.wordmark{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:clamp(36px,6vw,58px);
    margin:0;
    line-height:1;
    letter-spacing:-.01em;
  }
  .wordmark em{
    font-style:italic;
    font-weight:500;
    color:#C98A5E;
  }
  .tagline{
    font-family:'IBM Plex Mono',monospace;
    font-size:12.5px;
    color:#C9C2A8;
    margin-top:10px;
    letter-spacing:.02em;
  }
  .card-count{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    text-align:right;
    color:#C9C2A8;
    line-height:1.7;
  }
  .card-count strong{color:#EFE9D4;font-size:20px;display:block;font-family:'Fraunces',serif;font-weight:600;}

  /* ---------- Drawer tabs (category filter) ---------- */
  nav.drawers{
    max-width:920px;
    margin:0 auto;
    padding:0 24px;
    transform:translateY(-1px);
    display:flex;
    gap:6px;
    flex-wrap:wrap;
  }
  .tab{
    font-family:'IBM Plex Mono',monospace;
    font-size:11.5px;
    letter-spacing:.06em;
    text-transform:uppercase;
    background:var(--manila);
    border:1px solid var(--manila-dark);
    border-bottom:none;
    color:var(--ink-soft);
    padding:9px 16px 8px;
    cursor:pointer;
    border-radius:3px 3px 0 0;
    position:relative;
    top:1px;
    transition:background .15s ease, color .15s ease, transform .12s ease;
  }
  .tab:hover{transform:translateY(-2px);}
  .tab.active{
    background:var(--card);
    color:var(--rust);
    border-color:var(--line);
    font-weight:600;
  }

  /* ---------- Search rail ---------- */
  .rail{
    max-width:920px;
    margin:0 auto;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:0 4px 4px 4px;
    padding:16px 20px;
    display:flex;
    align-items:center;
    gap:12px;
    box-shadow:0 2px 0 rgba(0,0,0,.03);
  }
  .rail input{
    flex:1;
    border:none;
    background:transparent;
    font-family:'IBM Plex Mono',monospace;
    font-size:13.5px;
    color:var(--ink);
    outline:none;
    padding:4px 0;
    border-bottom:1px dashed var(--line);
  }
  .rail input::placeholder{color:#B7AD8E;}
  .rail .hint{
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    color:#B7AD8E;
    white-space:nowrap;
  }

  /* ---------- Main grid ---------- */
  main{
    max-width:920px;
    margin:0 auto;
    padding:26px 24px 80px;
  }
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(258px,1fr));
    gap:20px;
  }

  /* ---------- Index card ---------- */
  .note{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:2px;
    padding:20px 18px 18px;
    position:relative;
    box-shadow:0 1px 0 rgba(0,0,0,.04), 0 8px 14px -12px rgba(42,38,33,.25);
    display:flex;
    flex-direction:column;
    min-height:190px;
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .note:hover{
    transform:translateY(-3px) rotate(-.3deg);
    box-shadow:0 4px 0 rgba(0,0,0,.04), 0 14px 22px -14px rgba(42,38,33,.35);
  }
  .note::before{ /* punch hole */
    content:"";
    position:absolute;
    top:12px; left:50%;
    transform:translateX(-50%);
    width:9px;height:9px;
    background:var(--hole);
    border:1px solid var(--line);
    border-radius:50%;
    box-shadow: inset 0 1px 2px rgba(0,0,0,.15);
  }
  .note-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    margin-top:8px;
    margin-bottom:10px;
  }
  .stamp{
    font-family:'IBM Plex Mono',monospace;
    font-size:9.5px;
    letter-spacing:.09em;
    text-transform:uppercase;
    color:var(--rust);
    border:1px solid var(--rust);
    padding:2px 7px;
    border-radius:2px;
    transform:rotate(-2deg);
    opacity:.85;
  }
  .date{
    font-family:'IBM Plex Mono',monospace;
    font-size:10px;
    color:#B7AD8E;
  }
  .note h3{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:19px;
    margin:0 0 8px;
    line-height:1.25;
  }
  .note p{
    font-size:14px;
    line-height:1.55;
    color:var(--ink-soft);
    margin:0 0 14px;
    flex:1;
  }
  .note-foot{
    display:flex;
    justify-content:space-between;
    align-items:center;
    border-top:1px dashed var(--line);
    padding-top:10px;
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    color:#B7AD8E;
  }
  .note-foot .callno{color:var(--shelf-green); font-weight:600;}

  .empty{
    grid-column:1/-1;
    text-align:center;
    padding:60px 20px;
    color:#B7AD8E;
    font-family:'IBM Plex Mono',monospace;
    font-size:13px;
  }

  /* ---------- Add card (+ tile) ---------- */
  .add-tile{
    background:transparent;
    border:2px dashed var(--manila-dark);
    border-radius:2px;
    min-height:190px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:8px;
    cursor:pointer;
    color:var(--ink-soft);
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    letter-spacing:.05em;
    text-transform:uppercase;
    transition:background .15s ease, border-color .15s ease;
  }
  .add-tile:hover{background:rgba(228,216,184,.35); border-color:var(--rust);}
  .add-tile .plus{
    font-family:'Fraunces',serif;
    font-size:34px;
    font-weight:500;
    color:var(--rust);
    line-height:1;
  }

  .note .del{
    position:absolute;
    top:8px; right:10px;
    font-family:'IBM Plex Mono',monospace;
    font-size:13px;
    color:#C9BE9A;
    cursor:pointer;
    background:none;
    border:none;
    padding:2px 4px;
  }
  .note .del:hover{color:var(--rust);}
  .note .edit{
    position:absolute;
    top:8px; right:32px;
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    color:#C9BE9A;
    cursor:pointer;
    background:none;
    border:none;
    padding:2px 4px;
  }
  .note .edit:hover{color:var(--shelf-green);}

  /* ---------- Quiz builder (in add/edit modal) ---------- */
  .qblock{
    border:1px solid var(--line);
    border-radius:3px;
    padding:14px;
    margin-bottom:12px;
    background:var(--paper);
  }
  .qblock .qnum{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    text-transform:uppercase;
    color:var(--rust);
    margin-bottom:8px;
    font-weight:600;
  }
  .qblock .opt-row{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:6px;
  }
  .qblock .opt-row input[type="text"]{
    flex:1;
    font-size:13px;
    padding:6px 8px;
  }

  /* ---------- Quiz-taking UI (view modal) ---------- */
  .quiz-progress{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    color:#B7AD8E;
    margin-bottom:10px;
  }
  .quiz-question{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:18px;
    margin-bottom:16px;
  }
  .quiz-option{
    display:flex;
    align-items:center;
    gap:10px;
    border:1px solid var(--line);
    border-radius:3px;
    padding:12px 14px;
    margin-bottom:8px;
    cursor:pointer;
    font-size:14.5px;
    transition:background .12s ease;
  }
  .quiz-option:hover{background:rgba(228,216,184,.25);}
  .quiz-option.correct{border-color:#2F4A3C; background:rgba(47,74,60,.08);}
  .quiz-option.wrong{border-color:var(--rust); background:rgba(180,80,47,.08);}
  .quiz-option.disabled{cursor:default;}
  .quiz-option .dot{
    width:9px;height:9px;border-radius:50%;border:1.5px solid var(--line); flex-shrink:0;
  }
  .quiz-option.correct .dot{background:#2F4A3C; border-color:#2F4A3C;}
  .quiz-option.wrong .dot{background:var(--rust); border-color:var(--rust);}
  .quiz-solution{
    margin-top:16px;
    padding-top:14px;
    border-top:1px dashed var(--line);
    font-size:14px;
    line-height:1.6;
    color:var(--ink-soft);
  }
  .quiz-solution .sol-label{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    text-transform:uppercase;
    color:#B7AD8E;
    margin-bottom:6px;
  }

  /* ---------- Modal (new card form) ---------- */
  .overlay{
    position:fixed; inset:0;
    background:rgba(26,22,17,.55);
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
    z-index:50;
  }
  .overlay.open{display:flex;}
  .modal{
    background:var(--card);
    width:100%;
    max-width:460px;
    border-radius:3px;
    padding:26px 26px 22px;
    box-shadow:0 20px 50px -10px rgba(0,0,0,.4);
    position:relative;
    border:1px solid var(--line);
  }
  .modal h2{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:22px;
    margin:0 0 4px;
  }
  .modal .sub{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    color:#B7AD8E;
    margin-bottom:18px;
  }
  .field{margin-bottom:14px;}
  .field label{
    display:block;
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    text-transform:uppercase;
    letter-spacing:.07em;
    color:var(--ink-soft);
    margin-bottom:5px;
  }
  .field input, .field select, .field textarea{
    width:100%;
    font-family:'Lora',serif;
    font-size:14px;
    color:var(--ink);
    border:1px solid var(--line);
    border-radius:2px;
    padding:9px 10px;
    background:var(--paper);
    outline:none;
  }
  .field textarea{resize:vertical; min-height:70px; font-family:'Lora',serif;}
  .field select{font-family:'IBM Plex Mono',monospace; font-size:12.5px;}
  .field input:focus, .field select:focus, .field textarea:focus{border-color:var(--rust);}
  .modal-actions{
    display:flex;
    justify-content:flex-end;
    gap:10px;
    margin-top:6px;
  }
  .btn{
    font-family:'IBM Plex Mono',monospace;
    font-size:11.5px;
    text-transform:uppercase;
    letter-spacing:.06em;
    padding:9px 18px;
    border-radius:2px;
    cursor:pointer;
    border:1px solid var(--line);
    background:transparent;
    color:var(--ink-soft);
  }
  .btn.primary{
    background:var(--shelf-green);
    border-color:var(--shelf-green);
    color:#EFE9D4;
  }
  .btn.primary:hover{background:var(--shelf-green-dark);}
  .modal-close{
    position:absolute; top:14px; right:16px;
    font-family:'IBM Plex Mono',monospace;
    font-size:18px;
    background:none; border:none;
    color:#B7AD8E; cursor:pointer;
  }

  footer{
    text-align:center;
    padding:26px;
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    color:#B7AD8E;
    border-top:1px solid var(--line);
  }

  @media (max-width:520px){
    .card-count{text-align:left;}
    .plate-wrap{align-items:flex-start;}
  }
</style>
</head>
<body>

<header class="top">
  <div class="plate-wrap">
    <div>
      <span class="plate">Personal Catalog · Est. 2026</span>
      <h1 class="wordmark">Wisdom <em>Wise</em></h1>
      <div class="tagline">notes, write-ups & things worth passing on</div>
    </div>
    <div class="card-count"><strong id="countNum">0</strong>cards on file</div>
  </div>
</header>

<nav class="drawers" id="drawers">
  <button class="tab active" data-cat="all">All Drawers</button>
  <button class="tab" data-cat="notes">Notes</button>
  <button class="tab" data-cat="knowledge">Knowledge Transfer</button>
  <button class="tab" data-cat="writing">Writing</button>
  <button class="tab" data-cat="quiz">Quiz / Test Series</button>
  <button class="tab" data-cat="wisdom">Wisdom Words</button>
  <button class="tab" data-cat="personal" id="personalTab" style="display:none;">Personal</button>
</nav>

<main>
  <div class="rail">
    <input id="search" type="text" placeholder="Search the catalog…">
    <span class="hint">title / tag / text</span>
  </div>

  <div class="grid" id="grid"></div>
</main>

<footer>
  Card catalog · <span id="authLink" style="text-decoration:underline; cursor:pointer;">Sign in</span>
</footer>

<div class="overlay" id="authOverlay">
  <div class="modal">
    <button class="modal-close" id="authClose">&times;</button>
    <h2>Sign in</h2>
    <div class="sub">paste your GitHub access token — it's stored only in this browser</div>
    <div class="field">
      <label for="fToken">Access token</label>
      <input id="fToken" type="password" placeholder="github_pat_...">
    </div>
    <div class="modal-actions">
      <button class="btn" id="authCancel">Cancel</button>
      <button class="btn primary" id="authSave">Sign in</button>
    </div>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="modal" id="mainModal" style="max-width:460px; max-height:88vh; overflow-y:auto;">
    <button class="modal-close" id="modalClose">&times;</button>
    <h2 id="modalHeading">New card</h2>
    <div class="sub" id="modalSub">it'll be filed into the catalog on save</div>

    <div class="field">
      <label for="fTitle" id="fTitleLabel">Title</label>
      <input id="fTitle" type="text" placeholder="What's this note called?">
    </div>

    <div class="field">
      <label for="fCat">Drawer</label>
      <select id="fCat">
        <option value="notes">Notes</option>
        <option value="knowledge">Knowledge Transfer</option>
        <option value="writing">Writing</option>
        <option value="quiz">Quiz / Test Series</option>
        <option value="wisdom">Wisdom Words</option>
        <option value="personal">Personal (only you)</option>
      </select>
    </div>

    <div class="field">
      <label for="fTag">Tag</label>
      <input id="fTag" type="text" placeholder="e.g. devops, essay, template">
    </div>

    <div class="field">
      <label>Color</label>
      <div id="swatches" style="display:flex; gap:8px;"></div>
      <input type="hidden" id="fColor" value="">
    </div>

    <div id="standardFields">
      <div class="field">
        <label for="fBody" id="fBodyLabel">Contents</label>
        <div style="display:flex; gap:6px; margin-bottom:6px;">
          <button type="button" class="btn" id="boldBtn" style="padding:4px 10px; font-weight:700;">B</button>
          <button type="button" class="btn" id="italicBtn" style="padding:4px 10px; font-style:italic;">i</button>
        </div>
        <textarea id="fBody" placeholder="Type the note itself here… (select text and click B / i to format)"></textarea>
      </div>
    </div>

    <div id="quizFields" style="display:none;">
      <div class="field">
        <label for="fQCount">Number of questions</label>
        <input id="fQCount" type="number" min="1" max="20" value="5">
      </div>
      <div id="quizBuilder"></div>
    </div>

    <div class="field">
      <label for="fAttach">Attach files (image, PDF, Word doc)</label>
      <input id="fAttach" type="file" accept="image/*,application/pdf,.doc,.docx" multiple>
    </div>

    <div class="modal-actions">
      <button class="btn" id="cancelBtn">Cancel</button>
      <button class="btn primary" id="saveBtn">Save card</button>
    </div>
  </div>
</div>

<div class="overlay" id="viewOverlay">
  <div class="modal" style="max-width:560px; max-height:88vh; overflow-y:auto;">
    <button class="modal-close" id="viewClose">&times;</button>
    <div class="sub" id="viewMeta">&nbsp;</div>
    <h2 id="viewTitle" style="margin-bottom:14px;"></h2>
    <div id="viewBody" style="font-size:14.5px; line-height:1.7; color:var(--ink-soft); white-space:pre-wrap; max-height:50vh; overflow-y:auto;"></div>
    <div id="viewQuiz" style="display:none; margin-top:6px;">
      <div class="quiz-progress" id="quizProgress"></div>
      <div class="quiz-question" id="quizQuestionText"></div>
      <div id="quizOptions"></div>
      <div class="quiz-solution" id="quizSolution" style="display:none;">
        <div class="sol-label">Solution</div>
        <div id="quizSolutionText"></div>
      </div>
      <div class="modal-actions" style="margin-top:16px;">
        <button class="btn primary" id="quizNextBtn" style="display:none;">Next question</button>
      </div>
    </div>
    <div id="viewAttachments" style="margin-top:16px; display:flex; flex-direction:column; gap:10px;"></div>
  </div>
</div>

<script>
  // ---- Edit this array with your own content ----
  const NOTES = [
    {
      id: "d1",
      title: "Setting up a new laptop, without the pain",

      tag: "onboarding",

    },
    {

      cat: "knowledge",
      tag: "architecture",
      date: "2026-05-14",
      callno: "KT / 009",
      excerpt: "Not a takedown of document stores — just the specific constraints that tipped it for this project."
    },
    {
      id: "d3",
      title: "Reading notes: on writing clearly",

      tag: "reading",

      callno: "N / 021",
      excerpt: "Three ideas from this month's reading that actually changed how I draft things."
    },
    {
      id: "d4",
      title: "Debugging a flaky CI pipeline",
      cat: "knowledge",
      tag: "devops",
      date: "2026-04-11",
      callno: "KT / 007",
      excerpt: "It wasn't the tests. It was never the tests. A short post-mortem for future me."
    },
    {
      id: "d5",
      title: "A short essay on slow mornings",
      cat: "writing",
      tag: "essay",
      date: "2026-03-22",
      callno: "W / 003",
      excerpt: "On the fifteen minutes before the day officially starts, and why I stopped skipping them."
    },
    {
      id: "d6",
      title: "Meeting notes → decisions template",
      cat: "notes",
      tag: "template",
      date: "2026-03-05",
      callno: "N / 015",
      excerpt: "The format that finally got people to stop re-litigating decisions two weeks later."
    },
  ];

  const grid = document.getElementById('grid');
  const countNum = document.getElementById('countNum');
  const search = document.getElementById('search');
  const tabs = document.querySelectorAll('.tab');
  let activeCat = 'all';

  // ---- GitHub-as-database config ----
  const GH_OWNER = 'dky-dynamic';
  const GH_REPO  = 'dky-dynamic.github.io';
  const GH_PATH  = 'notes.json';
  const GH_BRANCH = 'main';
  const TOKEN_KEY = 'field-notes-gh-token';

  const CAT_PREFIX = { notes:'N', knowledge:'KT', writing:'W', quiz:'Q', wisdom:'WW', personal:'P' };
  const SWATCHES = ['#B4502F', '#2F4A3C', '#8A6D3B', '#4B5FA8', '#7A4B8A', '#5B5548'];

  let userNotes = [];       // loaded from notes.json in the repo
  let hiddenDefaults = [];  // ids of default sample cards the owner has deleted
  let fileSha = null;       // needed to update the file
  let cloudLoaded = false;

  function b64EncodeUnicode(str){
    return btoa(unescape(encodeURIComponent(str)));
  }
  function b64DecodeUnicode(str){
    return decodeURIComponent(escape(atob(str)));
  }

  function getToken(){ return localStorage.getItem(TOKEN_KEY) || ''; }
  function isSignedIn(){ return !!getToken(); }

  async function fetchCloudNotes(){
    const url = `https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/contents/${GH_PATH}?ref=${GH_BRANCH}`;
    try{
      const res = await fetch(url, { headers: { 'Accept':'application/vnd.github+json' } });
      if(res.status === 404){ userNotes = []; hiddenDefaults = []; fileSha = null; }
      else if(res.ok){
        const data = await res.json();
        fileSha = data.sha;
        const decoded = b64DecodeUnicode(data.content.replace(/\n/g,''));
        const parsed = JSON.parse(decoded || '[]');
        if(Array.isArray(parsed)){ // old format: plain array of cards
          userNotes = parsed;
          hiddenDefaults = [];
        } else {
          userNotes = parsed.cards || [];
          hiddenDefaults = parsed.hiddenDefaults || [];
        }
      } else {
        userNotes = []; hiddenDefaults = [];
      }
    }catch(e){
      userNotes = []; hiddenDefaults = [];
    }
    cloudLoaded = true;
    render();
  }

  async function saveCloudNotes(message){
    const token = getToken();
    if(!token){ alert('Please sign in first.'); return false; }
    const url = `https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/contents/${GH_PATH}`;
    const payload = { cards: userNotes, hiddenDefaults: hiddenDefaults };
    const body = {
      message: message || 'update notes.json',
      content: b64EncodeUnicode(JSON.stringify(payload, null, 2)),
      branch: GH_BRANCH
    };
    if(fileSha) body.sha = fileSha;
    try{
      const res = await fetch(url, {
        method: 'PUT',
        headers: {
          'Accept':'application/vnd.github+json',
          'Authorization': `token ${token}`,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify(body)
      });
      if(!res.ok){
        const err = await res.json().catch(()=>({}));
        alert('Save failed: ' + (err.message || res.status));
        return false;
      }
      const data = await res.json();
      fileSha = data.content.sha;
      return true;
    }catch(e){
      alert('Save failed — check your connection.');
      return false;
    }
  }

  async function uploadAttachment(file){
    const token = getToken();
    const safeName = file.name.replace(/[^a-zA-Z0-9._-]/g, '_');
    const path = `uploads/${Date.now()}-${safeName}`;
    const base64 = await new Promise((resolve, reject)=>{
      const reader = new FileReader();
      reader.onload = ()=> resolve(reader.result.split(',')[1]);
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
    const res = await fetch(`https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/contents/${path}`, {
      method: 'PUT',
      headers: {
        'Accept':'application/vnd.github+json',
        'Authorization': `token ${token}`,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({ message: `attach ${safeName}`, content: base64, branch: GH_BRANCH })
    });
    if(!res.ok) throw new Error('attachment upload failed: ' + file.name);
    return { name: file.name, path, type: file.type };
  }

  function fmtDate(d){
    const dt = new Date(d + 'T00:00:00');
    return dt.toLocaleDateString('en-US', { month:'short', day:'numeric', year:'numeric' });
  }

  function nextCallNo(cat){
    const prefix = CAT_PREFIX[cat] || 'N';
    const countInCat = [...NOTES, ...userNotes].filter(n=>n.cat===cat).length + 1;
    return `${prefix} / ${String(countInCat).padStart(3,'0')}`;
  }

  function allNotes(){
    const visibleDefaults = NOTES.filter(n => !hiddenDefaults.includes(n.id));
    const combined = [...userNotes, ...visibleDefaults];
    return isSignedIn() ? combined : combined.filter(n => n.cat !== 'personal');
  }

  function stripMd(text){
    return (text || '').replace(/\*\*(.*?)\*\*/g, '$1').replace(/\*(.*?)\*/g, '$1');
  }

  function renderRichText(text){
    const esc = (text || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    return esc
      .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
      .replace(/\*(.*?)\*/g, '<em>$1</em>');
  }

  function render(){
    const q = search.value.trim().toLowerCase();
    const source = allNotes();
    const filtered = source.filter(n=>{
      const matchesCat = activeCat === 'all' || n.cat === activeCat;
      const hay = (n.title + ' ' + n.tag + ' ' + n.excerpt).toLowerCase();
      const matchesQ = !q || hay.includes(q);
      return matchesCat && matchesQ;
    });

    grid.innerHTML = '';
    countNum.textContent = source.length;

    if(isSignedIn()){
      const addTile = document.createElement('div');
      addTile.className = 'add-tile';
      addTile.innerHTML = `<span class="plus">+</span><span>New card</span>`;
      addTile.addEventListener('click', openAddModal);
      grid.appendChild(addTile);
    }

    if(!cloudLoaded){
      const loading = document.createElement('div');
      loading.className = 'empty';
      loading.textContent = 'Loading catalog…';
      grid.appendChild(loading);
      return;
    }

    if(filtered.length === 0){
      const empty = document.createElement('div');
      empty.className = 'empty';
      empty.textContent = 'No cards match that search.';
      grid.appendChild(empty);
      return;
    }

    filtered.forEach(n=>{
      const el = document.createElement('div');
      el.className = 'note';
      const accent = n.color || null;
      if(accent){ el.style.borderLeft = `4px solid ${accent}`; }
      const canManage = isSignedIn();
      const attachCount = (n.attachments && n.attachments.length) ? n.attachments.length : 0;
      const qCount = (n.cat === 'quiz' && n.questions) ? n.questions.length : 0;
      el.innerHTML = `
        ${canManage ? '<button class="edit" title="Edit card">&#9998;</button>' : ''}
        ${canManage ? '<button class="del" title="Delete card">&times;</button>' : ''}
        <div class="note-top">
          <span class="stamp" ${accent ? `style="color:${accent};border-color:${accent};"` : ''}>${n.tag}</span>
          <span class="date">${fmtDate(n.date)}</span>
        </div>
        <h3>${n.title}</h3>
        <p>${qCount ? qCount + ' questions' : stripMd(n.excerpt)}</p>
        <div class="note-foot">
          <span class="callno" ${accent ? `style="color:${accent};"` : ''}>${n.callno}</span>
          <span>${n.cat}${attachCount ? ' · 📎' + attachCount : ''}</span>
        </div>
      `;
      el.addEventListener('click', (e)=>{
        if(e.target.closest('.del') || e.target.closest('.edit')) return;
        openViewModal(n);
      });
      if(canManage){
        el.querySelector('.edit').addEventListener('click', (e)=>{
          e.stopPropagation();
          openAddModal(n);
        });
        el.querySelector('.del').addEventListener('click', async (e)=>{
          e.stopPropagation();
          const prevUser = userNotes;
          const prevHidden = hiddenDefaults;
          if(n.userAdded){
            userNotes = userNotes.filter(u=>u.id !== n.id);
          } else {
            hiddenDefaults = [...hiddenDefaults, n.id];
          }
          render();
          const ok = await saveCloudNotes(`delete card: ${n.title}`);
          if(!ok){ userNotes = prevUser; hiddenDefaults = prevHidden; render(); }
        });
      }
      grid.appendChild(el);
    });
  }

  tabs.forEach(tab=>{
    tab.addEventListener('click', ()=>{
      tabs.forEach(t=>t.classList.remove('active'));
      tab.classList.add('active');
      activeCat = tab.dataset.cat;
      render();
    });
  });

  search.addEventListener('input', render);

  // ---- Add/Edit-card modal ----
  const overlay = document.getElementById('overlay');
  const mainModal = document.getElementById('mainModal');
  const modalHeading = document.getElementById('modalHeading');
  const modalSub = document.getElementById('modalSub');
  const fTitle = document.getElementById('fTitle');
  const fTitleLabel = document.getElementById('fTitleLabel');
  const fCat = document.getElementById('fCat');
  const fTag = document.getElementById('fTag');
  const fBody = document.getElementById('fBody');
  const fBodyLabel = document.getElementById('fBodyLabel');
  const fColor = document.getElementById('fColor');
  const fAttach = document.getElementById('fAttach');
  const swatchesEl = document.getElementById('swatches');
  const standardFields = document.getElementById('standardFields');
  const quizFields = document.getElementById('quizFields');
  const fQCount = document.getElementById('fQCount');
  const quizBuilder = document.getElementById('quizBuilder');

  let editingNote = null;         // the note object being edited, or null when adding
  let existingAttachments = [];   // attachments already on the note being edited

  SWATCHES.forEach((hex)=>{
    const sw = document.createElement('div');
    sw.style.cssText = `width:24px;height:24px;border-radius:50%;background:${hex};cursor:pointer;border:2px solid transparent;`;
    sw.dataset.hex = hex;
    sw.addEventListener('click', ()=>{
      fColor.value = hex;
      [...swatchesEl.children].forEach(c=>c.style.borderColor = 'transparent');
      sw.style.borderColor = '#2A2621';
    });
    swatchesEl.appendChild(sw);
  });
  function selectSwatch(hex){
    fColor.value = hex || SWATCHES[0];
    [...swatchesEl.children].forEach(c=> c.style.borderColor = (c.dataset.hex === fColor.value) ? '#2A2621' : 'transparent');
  }

  function updateLabelsForCat(){
    const isQuiz = fCat.value === 'quiz';
    standardFields.style.display = isQuiz ? 'none' : 'block';
    quizFields.style.display = isQuiz ? 'block' : 'none';
    fTitleLabel.textContent = isQuiz ? 'Quiz title' : 'Title';
    fTitle.placeholder = isQuiz ? 'e.g. History Trivia Round 1' : "What's this note called?";
  }
  fCat.addEventListener('change', updateLabelsForCat);

  function quizBlockHTML(i, data){
    data = data || {};
    const opts = data.options || ['', '', '', ''];
    const correct = (typeof data.correctIndex === 'number') ? data.correctIndex : 0;
    return `
      <div class="qblock" data-qindex="${i}">
        <div class="qnum">Question ${i+1}</div>
        <div class="field">
          <label>Question text</label>
          <textarea class="qtext" rows="2" placeholder="Type the question…">${data.q || ''}</textarea>
        </div>
        ${[0,1,2,3].map(oi => `
          <div class="opt-row">
            <input type="radio" name="correct-${i}" value="${oi}" ${correct===oi?'checked':''}>
            <input type="text" class="qopt" data-oi="${oi}" placeholder="Option ${String.fromCharCode(65+oi)}" value="${(opts[oi]||'').replace(/"/g,'&quot;')}">
          </div>
        `).join('')}
        <div class="field" style="margin-top:8px;">
          <label>Solution / explanation</label>
          <textarea class="qsol" rows="2" placeholder="Why is this the correct answer?">${data.solution || ''}</textarea>
        </div>
      </div>
    `;
  }

  function buildQuizBlocks(count, existingQuestions){
    existingQuestions = existingQuestions || [];
    const preserved = readQuizBlocksFromDOM();
    quizBuilder.innerHTML = '';
    for(let i=0;i<count;i++){
      const data = preserved[i] || existingQuestions[i] || {};
      quizBuilder.insertAdjacentHTML('beforeend', quizBlockHTML(i, data));
    }
  }

  function readQuizBlocksFromDOM(){
    return [...quizBuilder.querySelectorAll('.qblock')].map(block=>{
      const q = block.querySelector('.qtext').value.trim();
      const options = [...block.querySelectorAll('.qopt')].map(o=>o.value.trim());
      const checked = block.querySelector('input[type="radio"]:checked');
      const correctIndex = checked ? parseInt(checked.value, 10) : 0;
      const solution = block.querySelector('.qsol').value.trim();
      return { q, options, correctIndex, solution };
    });
  }

  fQCount.addEventListener('input', ()=>{
    let n = parseInt(fQCount.value, 10);
    if(isNaN(n) || n < 1) n = 1;
    if(n > 20) n = 20;
    buildQuizBlocks(n);
  });

  function wrapSelection(marker){
    const start = fBody.selectionStart, end = fBody.selectionEnd;
    const val = fBody.value;
    const selected = val.slice(start, end) || 'text';
    fBody.value = val.slice(0, start) + marker + selected + marker + val.slice(end);
    fBody.focus();
  }
  document.getElementById('boldBtn').addEventListener('click', ()=>wrapSelection('**'));
  document.getElementById('italicBtn').addEventListener('click', ()=>wrapSelection('*'));

  function openAddModal(note){
    editingNote = note || null;
    existingAttachments = (note && note.attachments) ? [...note.attachments] : [];
    fAttach.value = '';

    if(note){
      modalHeading.textContent = 'Edit card';
      modalSub.textContent = 'changes save straight back to the catalog';
      document.getElementById('saveBtn').textContent = 'Save changes';
      fTitle.value = note.title || '';
      fCat.value = note.cat || 'notes';
      fTag.value = note.tag || '';
      selectSwatch(note.color);
      if(note.cat === 'quiz'){
        const qs = note.questions || [];
        fQCount.value = qs.length || 1;
        buildQuizBlocksFresh(qs.length || 1, qs);
      } else {
        fBody.value = note.body || '';
      }
    } else {
      modalHeading.textContent = 'New card';
      modalSub.textContent = "it'll be filed into the catalog on save";
      document.getElementById('saveBtn').textContent = 'Save card';
      fTitle.value = ''; fTag.value = ''; fBody.value = ''; fCat.value = 'notes';
      selectSwatch(SWATCHES[0]);
      fQCount.value = 5;
      buildQuizBlocksFresh(5, []);
    }
    updateLabelsForCat();
    overlay.classList.add('open');
    setTimeout(()=>fTitle.focus(), 50);
  }
  function buildQuizBlocksFresh(count, existingQuestions){
    quizBuilder.innerHTML = '';
    for(let i=0;i<count;i++){
      quizBuilder.insertAdjacentHTML('beforeend', quizBlockHTML(i, existingQuestions[i] || {}));
    }
  }
  function closeAddModal(){ overlay.classList.remove('open'); editingNote = null; }

  document.getElementById('modalClose').addEventListener('click', closeAddModal);
  document.getElementById('cancelBtn').addEventListener('click', closeAddModal);
  overlay.addEventListener('click', (e)=>{ if(e.target === overlay) closeAddModal(); });

  document.getElementById('saveBtn').addEventListener('click', async ()=>{
    const title = fTitle.value.trim();
    if(!title) return;

    const cat = fCat.value;
    const tag = fTag.value.trim() || cat;
    const today = new Date().toISOString().slice(0,10);
    const isQuiz = cat === 'quiz';

    let questions = null, body = '', excerpt = '';
    if(isQuiz){
      questions = readQuizBlocksFromDOM().filter(q => q.q && q.options.some(o=>o));
      if(questions.length === 0){ alert('Add at least one question with some options.'); return; }
      excerpt = `${questions.length} question${questions.length===1?'':'s'}`;
    } else {
      body = fBody.value.trim();
      if(!body) return;
      excerpt = stripMd(body).length > 130 ? stripMd(body).slice(0,130).trim() + '…' : stripMd(body);
    }

    const saveBtn = document.getElementById('saveBtn');
    saveBtn.textContent = 'Saving…'; saveBtn.disabled = true;

    let newUploads = [];
    try{
      if(fAttach.files && fAttach.files.length){
        saveBtn.textContent = 'Uploading files…';
        newUploads = await Promise.all([...fAttach.files].map(uploadAttachment));
      }
    }catch(e){
      alert('One or more attachments failed to upload. Saving the card without the new ones.');
    }
    const attachments = [...existingAttachments, ...newUploads];

    const wasEditingDefault = editingNote && !editingNote.userAdded;
    const keepId = (editingNote && editingNote.userAdded) ? editingNote.id : 'u-' + Date.now();
    const keepDate = (editingNote && editingNote.userAdded) ? editingNote.date : today;

    const note = {
      id: keepId,
      title, cat, tag,
      date: keepDate,
      callno: (editingNote && editingNote.callno) || nextCallNo(cat),
      excerpt,
      body: isQuiz ? '' : body,
      questions: isQuiz ? questions : undefined,
      color: fColor.value || null,
      attachments,
      userAdded: true
    };

    saveBtn.textContent = 'Saving…';

    const prevUser = userNotes;
    const prevHidden = hiddenDefaults;

    if(editingNote && editingNote.userAdded){
      userNotes = userNotes.map(u => u.id === editingNote.id ? note : u);
    } else if(wasEditingDefault){
      hiddenDefaults = [...hiddenDefaults, editingNote.id];
      userNotes = [note, ...userNotes];
    } else {
      userNotes = [note, ...userNotes];
    }

    const ok = await saveCloudNotes(editingNote ? `edit card: ${title}` : `add card: ${title}`);
    saveBtn.textContent = editingNote ? 'Save changes' : 'Save card'; saveBtn.disabled = false;

    if(ok){ closeAddModal(); render(); }
    else{ userNotes = prevUser; hiddenDefaults = prevHidden; }
  });

  // ---- View modal ----
  const viewOverlay = document.getElementById('viewOverlay');
  const viewTitle = document.getElementById('viewTitle');
  const viewMeta = document.getElementById('viewMeta');
  const viewBody = document.getElementById('viewBody');
  const viewQuiz = document.getElementById('viewQuiz');
  const quizProgress = document.getElementById('quizProgress');
  const quizQuestionText = document.getElementById('quizQuestionText');
  const quizOptions = document.getElementById('quizOptions');
  const quizSolution = document.getElementById('quizSolution');
  const quizSolutionText = document.getElementById('quizSolutionText');
  const quizNextBtn = document.getElementById('quizNextBtn');
  const viewAttachments = document.getElementById('viewAttachments');

  let quizState = null; // { questions, idx }

  function showQuizQuestion(){
    const { questions, idx } = quizState;
    const q = questions[idx];
    quizProgress.textContent = `Question ${idx+1} of ${questions.length}`;
    quizQuestionText.textContent = q.q;
    quizSolution.style.display = 'none';
    quizNextBtn.style.display = 'none';

    quizOptions.innerHTML = '';
    q.options.forEach((optText, oi)=>{
      if(!optText) return;
      const row = document.createElement('div');
      row.className = 'quiz-option';
      row.innerHTML = `<span class="dot"></span><span>${optText}</span>`;
      row.addEventListener('click', ()=>{
        if(row.dataset.answered) return;
        [...quizOptions.children].forEach(r=>r.dataset.answered = '1');
        [...quizOptions.children].forEach((r, ri)=>{
          r.classList.add('disabled');
          if(ri === q.correctIndex) r.classList.add('correct');
        });
        if(oi !== q.correctIndex) row.classList.add('wrong');
        quizSolutionText.innerHTML = renderRichText(q.solution || 'No explanation added for this one.');
        quizSolution.style.display = 'block';
        quizNextBtn.style.display = 'inline-block';
        quizNextBtn.textContent = (idx < questions.length - 1) ? 'Next question' : 'Finish';
      });
      quizOptions.appendChild(row);
    });
  }
  quizNextBtn.addEventListener('click', ()=>{
    if(quizState.idx < quizState.questions.length - 1){
      quizState.idx++;
      showQuizQuestion();
    } else {
      viewOverlay.classList.remove('open');
    }
  });

  function openViewModal(n){
    viewTitle.textContent = n.title;
    viewMeta.textContent = `${n.callno}  ·  ${n.cat}  ·  ${n.tag}  ·  ${fmtDate(n.date)}`;

    if(n.cat === 'quiz' && n.questions && n.questions.length){
      viewBody.style.display = 'none';
      viewQuiz.style.display = 'block';
      quizState = { questions: n.questions, idx: 0 };
      showQuizQuestion();
    } else {
      viewBody.style.display = 'block';
      viewQuiz.style.display = 'none';
      viewBody.innerHTML = renderRichText(n.body || n.excerpt);
    }

    viewAttachments.innerHTML = '';
    (n.attachments || []).forEach(att=>{
      if(att.type && att.type.startsWith('image/')){
        const img = document.createElement('img');
        img.src = att.path;
        img.style.cssText = 'max-width:100%;border-radius:4px;border:1px solid var(--line);';
        viewAttachments.appendChild(img);
      } else {
        const link = document.createElement('a');
        link.href = att.path;
        link.target = '_blank';
        link.textContent = '📎 ' + att.name;
        link.style.cssText = 'font-family:\'IBM Plex Mono\',monospace;font-size:12px;color:var(--rust);text-decoration:underline;';
        viewAttachments.appendChild(link);
      }
    });

    viewOverlay.classList.add('open');
  }
  document.getElementById('viewClose').addEventListener('click', ()=>viewOverlay.classList.remove('open'));
  viewOverlay.addEventListener('click', (e)=>{ if(e.target === viewOverlay) viewOverlay.classList.remove('open'); });

  // ---- Sign in ----
  const authOverlay = document.getElementById('authOverlay');
  const authLink = document.getElementById('authLink');
  const fToken = document.getElementById('fToken');

  function refreshAuthLink(){
    authLink.textContent = isSignedIn() ? 'Sign out' : 'Sign in';
    const personalTab = document.getElementById('personalTab');
    personalTab.style.display = isSignedIn() ? '' : 'none';
    if(!isSignedIn() && activeCat === 'personal'){
      activeCat = 'all';
      tabs.forEach(t=>t.classList.remove('active'));
      document.querySelector('.tab[data-cat="all"]').classList.add('active');
    }
  }

  authLink.addEventListener('click', ()=>{
    if(isSignedIn()){
      localStorage.removeItem(TOKEN_KEY);
      refreshAuthLink();
      render();
    } else {
      fToken.value = '';
      authOverlay.classList.add('open');
      setTimeout(()=>fToken.focus(), 50);
    }
  });
  document.getElementById('authClose').addEventListener('click', ()=>authOverlay.classList.remove('open'));
  document.getElementById('authCancel').addEventListener('click', ()=>authOverlay.classList.remove('open'));
  authOverlay.addEventListener('click', (e)=>{ if(e.target === authOverlay) authOverlay.classList.remove('open'); });

  document.getElementById('authSave').addEventListener('click', ()=>{
    const t = fToken.value.trim();
    if(!t) return;
    localStorage.setItem(TOKEN_KEY, t);
    authOverlay.classList.remove('open');
    refreshAuthLink();
    render();
  });

  refreshAuthLink();
  fetchCloudNotes();
</script>

</body>
</html>
