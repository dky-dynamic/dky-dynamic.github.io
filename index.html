<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Field Notes — a personal catalog</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500;600&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet">
<style>
  :root{
    --manila: #E4D8B8;
    --manila-dark: #CBB988;
    --paper: #FAF6EC;
    --card: #FFFDF7;
    --ink: #2A2621;
    --ink-soft: #5B5548;
    --shelf-green: #2F4A3C;
    --shelf-green-dark: #22362B;
    --rust: #B4502F;
    --line: #D8CBA6;
    --hole: #EFE9D4;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:var(--paper);
    background-image:
      radial-gradient(circle at 1px 1px, rgba(0,0,0,0.035) 1px, transparent 0);
    background-size: 22px 22px;
    color:var(--ink);
    font-family:'Lora', serif;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;}

  /* ---------- Header: drawer label plate ---------- */
  header.top{
    background:var(--shelf-green);
    color:#EFE9D4;
    padding:38px 24px 26px;
    position:relative;
    border-bottom:6px solid var(--shelf-green-dark);
  }
  .plate-wrap{
    max-width:920px;
    margin:0 auto;
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    gap:20px;
    flex-wrap:wrap;
  }
  .plate{
    display:inline-block;
    padding:4px 14px;
    border:1.5px solid #EFE9D4;
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    letter-spacing:.14em;
    text-transform:uppercase;
    margin-bottom:14px;
    color:#EFE9D4;
    opacity:.85;
  }
  h1.wordmark{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:clamp(36px,6vw,58px);
    margin:0;
    line-height:1;
    letter-spacing:-.01em;
  }
  .wordmark em{
    font-style:italic;
    font-weight:500;
    color:#C98A5E;
  }
  .tagline{
    font-family:'IBM Plex Mono',monospace;
    font-size:12.5px;
    color:#C9C2A8;
    margin-top:10px;
    letter-spacing:.02em;
  }
  .card-count{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    text-align:right;
    color:#C9C2A8;
    line-height:1.7;
  }
  .card-count strong{color:#EFE9D4;font-size:20px;display:block;font-family:'Fraunces',serif;font-weight:600;}

  /* ---------- Drawer tabs (category filter) ---------- */
  nav.drawers{
    max-width:920px;
    margin:0 auto;
    padding:0 24px;
    transform:translateY(-1px);
    display:flex;
    gap:6px;
    flex-wrap:wrap;
  }
  .tab{
    font-family:'IBM Plex Mono',monospace;
    font-size:11.5px;
    letter-spacing:.06em;
    text-transform:uppercase;
    background:var(--manila);
    border:1px solid var(--manila-dark);
    border-bottom:none;
    color:var(--ink-soft);
    padding:9px 16px 8px;
    cursor:pointer;
    border-radius:3px 3px 0 0;
    position:relative;
    top:1px;
    transition:background .15s ease, color .15s ease, transform .12s ease;
  }
  .tab:hover{transform:translateY(-2px);}
  .tab.active{
    background:var(--card);
    color:var(--rust);
    border-color:var(--line);
    font-weight:600;
  }

  /* ---------- Search rail ---------- */
  .rail{
    max-width:920px;
    margin:0 auto;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:0 4px 4px 4px;
    padding:16px 20px;
    display:flex;
    align-items:center;
    gap:12px;
    box-shadow:0 2px 0 rgba(0,0,0,.03);
  }
  .rail input{
    flex:1;
    border:none;
    background:transparent;
    font-family:'IBM Plex Mono',monospace;
    font-size:13.5px;
    color:var(--ink);
    outline:none;
    padding:4px 0;
    border-bottom:1px dashed var(--line);
  }
  .rail input::placeholder{color:#B7AD8E;}
  .rail .hint{
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    color:#B7AD8E;
    white-space:nowrap;
  }

  /* ---------- Main grid ---------- */
  main{
    max-width:920px;
    margin:0 auto;
    padding:26px 24px 80px;
  }
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(258px,1fr));
    gap:20px;
  }

  /* ---------- Index card ---------- */
  .note{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:2px;
    padding:20px 18px 18px;
    position:relative;
    box-shadow:0 1px 0 rgba(0,0,0,.04), 0 8px 14px -12px rgba(42,38,33,.25);
    display:flex;
    flex-direction:column;
    min-height:190px;
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .note:hover{
    transform:translateY(-3px) rotate(-.3deg);
    box-shadow:0 4px 0 rgba(0,0,0,.04), 0 14px 22px -14px rgba(42,38,33,.35);
  }
  .note::before{ /* punch hole */
    content:"";
    position:absolute;
    top:12px; left:50%;
    transform:translateX(-50%);
    width:9px;height:9px;
    background:var(--hole);
    border:1px solid var(--line);
    border-radius:50%;
    box-shadow: inset 0 1px 2px rgba(0,0,0,.15);
  }
  .note-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    margin-top:8px;
    margin-bottom:10px;
  }
  .stamp{
    font-family:'IBM Plex Mono',monospace;
    font-size:9.5px;
    letter-spacing:.09em;
    text-transform:uppercase;
    color:var(--rust);
    border:1px solid var(--rust);
    padding:2px 7px;
    border-radius:2px;
    transform:rotate(-2deg);
    opacity:.85;
  }
  .date{
    font-family:'IBM Plex Mono',monospace;
    font-size:10px;
    color:#B7AD8E;
  }
  .note h3{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:19px;
    margin:0 0 8px;
    line-height:1.25;
  }
  .note p{
    font-size:14px;
    line-height:1.55;
    color:var(--ink-soft);
    margin:0 0 14px;
    flex:1;
  }
  .note-foot{
    display:flex;
    justify-content:space-between;
    align-items:center;
    border-top:1px dashed var(--line);
    padding-top:10px;
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    color:#B7AD8E;
  }
  .note-foot .callno{color:var(--shelf-green); font-weight:600;}

  .empty{
    grid-column:1/-1;
    text-align:center;
    padding:60px 20px;
    color:#B7AD8E;
    font-family:'IBM Plex Mono',monospace;
    font-size:13px;
  }

  /* ---------- Add card (+ tile) ---------- */
  .add-tile{
    background:transparent;
    border:2px dashed var(--manila-dark);
    border-radius:2px;
    min-height:190px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:8px;
    cursor:pointer;
    color:var(--ink-soft);
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    letter-spacing:.05em;
    text-transform:uppercase;
    transition:background .15s ease, border-color .15s ease;
  }
  .add-tile:hover{background:rgba(228,216,184,.35); border-color:var(--rust);}
  .add-tile .plus{
    font-family:'Fraunces',serif;
    font-size:34px;
    font-weight:500;
    color:var(--rust);
    line-height:1;
  }

  .note .del{
    position:absolute;
    top:8px; right:10px;
    font-family:'IBM Plex Mono',monospace;
    font-size:13px;
    color:#C9BE9A;
    cursor:pointer;
    background:none;
    border:none;
    padding:2px 4px;
  }
  .note .del:hover{color:var(--rust);}

  /* ---------- Modal (new card form) ---------- */
  .overlay{
    position:fixed; inset:0;
    background:rgba(26,22,17,.55);
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
    z-index:50;
  }
  .overlay.open{display:flex;}
  .modal{
    background:var(--card);
    width:100%;
    max-width:460px;
    border-radius:3px;
    padding:26px 26px 22px;
    box-shadow:0 20px 50px -10px rgba(0,0,0,.4);
    position:relative;
    border:1px solid var(--line);
  }
  .modal h2{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:22px;
    margin:0 0 4px;
  }
  .modal .sub{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    color:#B7AD8E;
    margin-bottom:18px;
  }
  .field{margin-bottom:14px;}
  .field label{
    display:block;
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    text-transform:uppercase;
    letter-spacing:.07em;
    color:var(--ink-soft);
    margin-bottom:5px;
  }
  .field input, .field select, .field textarea{
    width:100%;
    font-family:'Lora',serif;
    font-size:14px;
    color:var(--ink);
    border:1px solid var(--line);
    border-radius:2px;
    padding:9px 10px;
    background:var(--paper);
    outline:none;
  }
  .field textarea{resize:vertical; min-height:70px; font-family:'Lora',serif;}
  .field select{font-family:'IBM Plex Mono',monospace; font-size:12.5px;}
  .field input:focus, .field select:focus, .field textarea:focus{border-color:var(--rust);}
  .modal-actions{
    display:flex;
    justify-content:flex-end;
    gap:10px;
    margin-top:6px;
  }
  .btn{
    font-family:'IBM Plex Mono',monospace;
    font-size:11.5px;
    text-transform:uppercase;
    letter-spacing:.06em;
    padding:9px 18px;
    border-radius:2px;
    cursor:pointer;
    border:1px solid var(--line);
    background:transparent;
    color:var(--ink-soft);
  }
  .btn.primary{
    background:var(--shelf-green);
    border-color:var(--shelf-green);
    color:#EFE9D4;
  }
  .btn.primary:hover{background:var(--shelf-green-dark);}
  .modal-close{
    position:absolute; top:14px; right:16px;
    font-family:'IBM Plex Mono',monospace;
    font-size:18px;
    background:none; border:none;
    color:#B7AD8E; cursor:pointer;
  }

  footer{
    text-align:center;
    padding:26px;
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    color:#B7AD8E;
    border-top:1px solid var(--line);
  }

  @media (max-width:520px){
    .card-count{text-align:left;}
    .plate-wrap{align-items:flex-start;}
  }
</style>
</head>
<body>

<header class="top">
  <div class="plate-wrap">
    <div>
      <span class="plate">Personal Catalog · Est. 2026</span>
      <h1 class="wordmark">Wisdom <em>Wise</em></h1>
      <div class="tagline">notes, write-ups & things worth passing on</div>
    </div>
    <div class="card-count"><strong id="countNum">0</strong>cards on file</div>
  </div>
</header>

<nav class="drawers" id="drawers">
  <button class="tab active" data-cat="all">All Drawers</button>
  <button class="tab" data-cat="notes">Notes</button>
  <button class="tab" data-cat="knowledge">Knowledge Transfer</button>
  <button class="tab" data-cat="writing">Writing</button>
</nav>

<main>
  <div class="rail">
    <input id="search" type="text" placeholder="Search the catalog…">
    <span class="hint">title / tag / text</span>
  </div>

  <div class="grid" id="grid"></div>
</main>

<footer>
  Card catalog · <span id="authLink" style="text-decoration:underline; cursor:pointer;">Sign in</span>
</footer>

<div class="overlay" id="authOverlay">
  <div class="modal">
    <button class="modal-close" id="authClose">&times;</button>
    <h2>Sign in</h2>
    <div class="sub">paste your GitHub access token — it's stored only in this browser</div>
    <div class="field">
      <label for="fToken">Access token</label>
      <input id="fToken" type="password" placeholder="github_pat_...">
    </div>
    <div class="modal-actions">
      <button class="btn" id="authCancel">Cancel</button>
      <button class="btn primary" id="authSave">Sign in</button>
    </div>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="modal">
    <button class="modal-close" id="modalClose">&times;</button>
    <h2>New card</h2>
    <div class="sub">it'll be filed into the catalog on save</div>

    <div class="field">
      <label for="fTitle">Title</label>
      <input id="fTitle" type="text" placeholder="What's this note called?">
    </div>

    <div class="field">
      <label for="fCat">Drawer</label>
      <select id="fCat">
        <option value="notes">Notes</option>
        <option value="knowledge">Knowledge Transfer</option>
        <option value="writing">Writing</option>
      </select>
    </div>

    <div class="field">
      <label for="fTag">Tag</label>
      <input id="fTag" type="text" placeholder="e.g. devops, essay, template">
    </div>

    <div class="field">
      <label for="fBody">Contents</label>
      <textarea id="fBody" placeholder="Type the note itself here…"></textarea>
    </div>

    <div class="modal-actions">
      <button class="btn" id="cancelBtn">Cancel</button>
      <button class="btn primary" id="saveBtn">Save card</button>
    </div>
  </div>
</div>

<div class="overlay" id="viewOverlay">
  <div class="modal" style="max-width:560px;">
    <button class="modal-close" id="viewClose">&times;</button>
    <div class="sub" id="viewMeta">&nbsp;</div>
    <h2 id="viewTitle" style="margin-bottom:14px;"></h2>
    <div id="viewBody" style="font-size:14.5px; line-height:1.7; color:var(--ink-soft); white-space:pre-wrap; max-height:50vh; overflow-y:auto;"></div>
  </div>
</div>

<script>
  // ---- Edit this array with your own content ----
  const NOTES = [
    {
      title: "Setting up a new laptop, without the pain",
      cat: "knowledge",
      tag: "onboarding",
      date: "2026-06-02",
      callno: "KT / 014",
      excerpt: "A checklist I wish I'd had on day one — accounts, dotfiles, the two settings everyone forgets to change."
    },
    {
      title: "Why we chose Postgres over Mongo (in the end)",
      cat: "knowledge",
      tag: "architecture",
      date: "2026-05-14",
      callno: "KT / 009",
      excerpt: "Not a takedown of document stores — just the specific constraints that tipped it for this project."
    },
    {
      title: "Reading notes: on writing clearly",
      cat: "notes",
      tag: "reading",
      date: "2026-04-30",
      callno: "N / 021",
      excerpt: "Three ideas from this month's reading that actually changed how I draft things."
    },
    {
      title: "Debugging a flaky CI pipeline",
      cat: "knowledge",
      tag: "devops",
      date: "2026-04-11",
      callno: "KT / 007",
      excerpt: "It wasn't the tests. It was never the tests. A short post-mortem for future me."
    },
    {
      title: "A short essay on slow mornings",
      cat: "writing",
      tag: "essay",
      date: "2026-03-22",
      callno: "W / 003",
      excerpt: "On the fifteen minutes before the day officially starts, and why I stopped skipping them."
    },
    {
      title: "Meeting notes → decisions template",
      cat: "notes",
      tag: "template",
      date: "2026-03-05",
      callno: "N / 015",
      excerpt: "The format that finally got people to stop re-litigating decisions two weeks later."
    },
  ];

  const grid = document.getElementById('grid');
  const countNum = document.getElementById('countNum');
  const search = document.getElementById('search');
  const tabs = document.querySelectorAll('.tab');
  let activeCat = 'all';

  // ---- GitHub-as-database config ----
  const GH_OWNER = 'dky-dynamic';
  const GH_REPO  = 'dky-dynamic.github.io';
  const GH_PATH  = 'notes.json';
  const GH_BRANCH = 'main';
  const TOKEN_KEY = 'field-notes-gh-token';

  const CAT_PREFIX = { notes:'N', knowledge:'KT', writing:'W' };

  let userNotes = [];   // loaded from notes.json in the repo
  let fileSha = null;   // needed to update the file
  let cloudLoaded = false;

  function b64EncodeUnicode(str){
    return btoa(unescape(encodeURIComponent(str)));
  }
  function b64DecodeUnicode(str){
    return decodeURIComponent(escape(atob(str)));
  }

  function getToken(){ return localStorage.getItem(TOKEN_KEY) || ''; }
  function isSignedIn(){ return !!getToken(); }

  async function fetchCloudNotes(){
    const url = `https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/contents/${GH_PATH}?ref=${GH_BRANCH}`;
    try{
      const res = await fetch(url, { headers: { 'Accept':'application/vnd.github+json' } });
      if(res.status === 404){ userNotes = []; fileSha = null; }
      else if(res.ok){
        const data = await res.json();
        fileSha = data.sha;
        const decoded = b64DecodeUnicode(data.content.replace(/\n/g,''));
        userNotes = JSON.parse(decoded || '[]');
      } else {
        userNotes = [];
      }
    }catch(e){
      userNotes = [];
    }
    cloudLoaded = true;
    render();
  }

  async function saveCloudNotes(message){
    const token = getToken();
    if(!token){ alert('Please sign in first.'); return false; }
    const url = `https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/contents/${GH_PATH}`;
    const body = {
      message: message || 'update notes.json',
      content: b64EncodeUnicode(JSON.stringify(userNotes, null, 2)),
      branch: GH_BRANCH
    };
    if(fileSha) body.sha = fileSha;
    try{
      const res = await fetch(url, {
        method: 'PUT',
        headers: {
          'Accept':'application/vnd.github+json',
          'Authorization': `token ${token}`,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify(body)
      });
      if(!res.ok){
        const err = await res.json().catch(()=>({}));
        alert('Save failed: ' + (err.message || res.status));
        return false;
      }
      const data = await res.json();
      fileSha = data.content.sha;
      return true;
    }catch(e){
      alert('Save failed — check your connection.');
      return false;
    }
  }

  function fmtDate(d){
    const dt = new Date(d + 'T00:00:00');
    return dt.toLocaleDateString('en-US', { month:'short', day:'numeric', year:'numeric' });
  }

  function nextCallNo(cat){
    const prefix = CAT_PREFIX[cat] || 'N';
    const countInCat = [...NOTES, ...userNotes].filter(n=>n.cat===cat).length + 1;
    return `${prefix} / ${String(countInCat).padStart(3,'0')}`;
  }

  function allNotes(){
    return [...userNotes, ...NOTES];
  }

  function render(){
    const q = search.value.trim().toLowerCase();
    const source = allNotes();
    const filtered = source.filter(n=>{
      const matchesCat = activeCat === 'all' || n.cat === activeCat;
      const hay = (n.title + ' ' + n.tag + ' ' + n.excerpt).toLowerCase();
      const matchesQ = !q || hay.includes(q);
      return matchesCat && matchesQ;
    });

    grid.innerHTML = '';
    countNum.textContent = source.length;

    if(isSignedIn()){
      const addTile = document.createElement('div');
      addTile.className = 'add-tile';
      addTile.innerHTML = `<span class="plus">+</span><span>New card</span>`;
      addTile.addEventListener('click', openAddModal);
      grid.appendChild(addTile);
    }

    if(!cloudLoaded){
      const loading = document.createElement('div');
      loading.className = 'empty';
      loading.textContent = 'Loading catalog…';
      grid.appendChild(loading);
      return;
    }

    if(filtered.length === 0){
      const empty = document.createElement('div');
      empty.className = 'empty';
      empty.textContent = 'No cards match that search.';
      grid.appendChild(empty);
      return;
    }

    filtered.forEach(n=>{
      const el = document.createElement('div');
      el.className = 'note';
      const canDelete = n.userAdded && isSignedIn();
      el.innerHTML = `
        ${canDelete ? '<button class="del" title="Delete card">&times;</button>' : ''}
        <div class="note-top">
          <span class="stamp">${n.tag}</span>
          <span class="date">${fmtDate(n.date)}</span>
        </div>
        <h3>${n.title}</h3>
        <p>${n.excerpt}</p>
        <div class="note-foot">
          <span class="callno">${n.callno}</span>
          <span>${n.cat}</span>
        </div>
      `;
      el.addEventListener('click', (e)=>{
        if(e.target.closest('.del')) return;
        openViewModal(n);
      });
      if(canDelete){
        el.querySelector('.del').addEventListener('click', async (e)=>{
          e.stopPropagation();
          const prev = userNotes;
          userNotes = userNotes.filter(u=>u.id !== n.id);
          render();
          const ok = await saveCloudNotes(`delete card: ${n.title}`);
          if(!ok){ userNotes = prev; render(); }
        });
      }
      grid.appendChild(el);
    });
  }

  tabs.forEach(tab=>{
    tab.addEventListener('click', ()=>{
      tabs.forEach(t=>t.classList.remove('active'));
      tab.classList.add('active');
      activeCat = tab.dataset.cat;
      render();
    });
  });

  search.addEventListener('input', render);

  // ---- Add-card modal ----
  const overlay = document.getElementById('overlay');
  const fTitle = document.getElementById('fTitle');
  const fCat = document.getElementById('fCat');
  const fTag = document.getElementById('fTag');
  const fBody = document.getElementById('fBody');

  function openAddModal(){
    fTitle.value = ''; fTag.value = ''; fBody.value = ''; fCat.value = 'notes';
    overlay.classList.add('open');
    setTimeout(()=>fTitle.focus(), 50);
  }
  function closeAddModal(){ overlay.classList.remove('open'); }

  document.getElementById('modalClose').addEventListener('click', closeAddModal);
  document.getElementById('cancelBtn').addEventListener('click', closeAddModal);
  overlay.addEventListener('click', (e)=>{ if(e.target === overlay) closeAddModal(); });

  document.getElementById('saveBtn').addEventListener('click', async ()=>{
    const title = fTitle.value.trim();
    const body = fBody.value.trim();
    if(!title || !body) return;

    const cat = fCat.value;
    const tag = fTag.value.trim() || cat;
    const today = new Date().toISOString().slice(0,10);
    const note = {
      id: 'u-' + Date.now(),
      title, cat, tag,
      date: today,
      callno: nextCallNo(cat),
      excerpt: body.length > 130 ? body.slice(0,130).trim() + '…' : body,
      body,
      userAdded: true
    };
    const saveBtn = document.getElementById('saveBtn');
    saveBtn.textContent = 'Saving…'; saveBtn.disabled = true;

    userNotes.unshift(note);
    const ok = await saveCloudNotes(`add card: ${title}`);
    saveBtn.textContent = 'Save card'; saveBtn.disabled = false;

    if(ok){ closeAddModal(); render(); }
    else{ userNotes.shift(); }
  });

  // ---- View modal ----
  const viewOverlay = document.getElementById('viewOverlay');
  const viewTitle = document.getElementById('viewTitle');
  const viewMeta = document.getElementById('viewMeta');
  const viewBody = document.getElementById('viewBody');

  function openViewModal(n){
    viewTitle.textContent = n.title;
    viewMeta.textContent = `${n.callno}  ·  ${n.cat}  ·  ${n.tag}  ·  ${fmtDate(n.date)}`;
    viewBody.textContent = n.body || n.excerpt;
    viewOverlay.classList.add('open');
  }
  document.getElementById('viewClose').addEventListener('click', ()=>viewOverlay.classList.remove('open'));
  viewOverlay.addEventListener('click', (e)=>{ if(e.target === viewOverlay) viewOverlay.classList.remove('open'); });

  // ---- Sign in ----
  const authOverlay = document.getElementById('authOverlay');
  const authLink = document.getElementById('authLink');
  const fToken = document.getElementById('fToken');

  function refreshAuthLink(){
    authLink.textContent = isSignedIn() ? 'Sign out' : 'Sign in';
  }

  authLink.addEventListener('click', ()=>{
    if(isSignedIn()){
      localStorage.removeItem(TOKEN_KEY);
      refreshAuthLink();
      render();
    } else {
      fToken.value = '';
      authOverlay.classList.add('open');
      setTimeout(()=>fToken.focus(), 50);
    }
  });
  document.getElementById('authClose').addEventListener('click', ()=>authOverlay.classList.remove('open'));
  document.getElementById('authCancel').addEventListener('click', ()=>authOverlay.classList.remove('open'));
  authOverlay.addEventListener('click', (e)=>{ if(e.target === authOverlay) authOverlay.classList.remove('open'); });

  document.getElementById('authSave').addEventListener('click', ()=>{
    const t = fToken.value.trim();
    if(!t) return;
    localStorage.setItem(TOKEN_KEY, t);
    authOverlay.classList.remove('open');
    refreshAuthLink();
    render();
  });

  refreshAuthLink();
  fetchCloudNotes();
</script>

</body>
</html>
