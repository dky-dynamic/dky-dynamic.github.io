<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Field Notes — a personal catalog</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500;600&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet">
<style>
  :root{
    --manila: #E4D8B8;
    --manila-dark: #CBB988;
    --paper: #FAF6EC;
    --card: #FFFDF7;
    --ink: #2A2621;
    --ink-soft: #5B5548;
    --shelf-green: #2F4A3C;
    --shelf-green-dark: #22362B;
    --rust: #B4502F;
    --line: #D8CBA6;
    --hole: #EFE9D4;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:var(--paper);
    background-image:
      radial-gradient(circle at 1px 1px, rgba(0,0,0,0.035) 1px, transparent 0);
    background-size: 22px 22px;
    color:var(--ink);
    font-family:'Lora', serif;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;}

  /* ---------- Header: drawer label plate ---------- */
  header.top{
    background:var(--shelf-green);
    color:#EFE9D4;
    padding:38px 24px 26px;
    position:relative;
    border-bottom:6px solid var(--shelf-green-dark);
  }
  .plate-wrap{
    max-width:920px;
    margin:0 auto;
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    gap:20px;
    flex-wrap:wrap;
  }
  .plate{
    display:inline-block;
    padding:4px 14px;
    border:1.5px solid #EFE9D4;
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    letter-spacing:.14em;
    text-transform:uppercase;
    margin-bottom:14px;
    color:#EFE9D4;
    opacity:.85;
  }
  h1.wordmark{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:clamp(36px,6vw,58px);
    margin:0;
    line-height:1;
    letter-spacing:-.01em;
  }
  .wordmark em{
    font-style:italic;
    font-weight:500;
    color:#C98A5E;
  }
  .tagline{
    font-family:'IBM Plex Mono',monospace;
    font-size:12.5px;
    color:#C9C2A8;
    margin-top:10px;
    letter-spacing:.02em;
  }
  .card-count{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    text-align:right;
    color:#C9C2A8;
    line-height:1.7;
  }
  .card-count strong{color:#EFE9D4;font-size:20px;display:block;font-family:'Fraunces',serif;font-weight:600;}

  /* ---------- Drawer tabs (category filter) ---------- */
  nav.drawers{
    max-width:920px;
    margin:0 auto;
    padding:0 24px;
    transform:translateY(-1px);
    display:flex;
    gap:6px;
    flex-wrap:wrap;
  }
  .tab{
    font-family:'IBM Plex Mono',monospace;
    font-size:11.5px;
    letter-spacing:.06em;
    text-transform:uppercase;
    background:var(--manila);
    border:1px solid var(--manila-dark);
    border-bottom:none;
    color:var(--ink-soft);
    padding:9px 16px 8px;
    cursor:pointer;
    border-radius:3px 3px 0 0;
    position:relative;
    top:1px;
    transition:background .15s ease, color .15s ease, transform .12s ease;
  }
  .tab:hover{transform:translateY(-2px);}
  .tab.active{
    background:var(--card);
    color:var(--rust);
    border-color:var(--line);
    font-weight:600;
  }

  /* ---------- Search rail ---------- */
  .rail{
    max-width:920px;
    margin:0 auto;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:0 4px 4px 4px;
    padding:16px 20px;
    display:flex;
    align-items:center;
    gap:12px;
    box-shadow:0 2px 0 rgba(0,0,0,.03);
  }
  .rail input{
    flex:1;
    border:none;
    background:transparent;
    font-family:'IBM Plex Mono',monospace;
    font-size:13.5px;
    color:var(--ink);
    outline:none;
    padding:4px 0;
    border-bottom:1px dashed var(--line);
  }
  .rail input::placeholder{color:#B7AD8E;}
  .rail .hint{
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    color:#B7AD8E;
    white-space:nowrap;
  }

  /* ---------- Main grid ---------- */
  main{
    max-width:920px;
    margin:0 auto;
    padding:26px 24px 80px;
  }
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(258px,1fr));
    gap:20px;
  }

  /* ---------- Index card ---------- */
  .note{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:2px;
    padding:20px 18px 18px;
    position:relative;
    box-shadow:0 1px 0 rgba(0,0,0,.04), 0 8px 14px -12px rgba(42,38,33,.25);
    display:flex;
    flex-direction:column;
    min-height:190px;
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .note:hover{
    transform:translateY(-3px) rotate(-.3deg);
    box-shadow:0 4px 0 rgba(0,0,0,.04), 0 14px 22px -14px rgba(42,38,33,.35);
  }
  .note::before{ /* punch hole */
    content:"";
    position:absolute;
    top:12px; left:50%;
    transform:translateX(-50%);
    width:9px;height:9px;
    background:var(--hole);
    border:1px solid var(--line);
    border-radius:50%;
    box-shadow: inset 0 1px 2px rgba(0,0,0,.15);
  }
  .note-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    margin-top:8px;
    margin-bottom:10px;
  }
  .stamp{
    font-family:'IBM Plex Mono',monospace;
    font-size:9.5px;
    letter-spacing:.09em;
    text-transform:uppercase;
    color:var(--rust);
    border:1px solid var(--rust);
    padding:2px 7px;
    border-radius:2px;
    transform:rotate(-2deg);
    opacity:.85;
  }
  .date{
    font-family:'IBM Plex Mono',monospace;
    font-size:10px;
    color:#B7AD8E;
  }
  .note h3{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:19px;
    margin:0 0 8px;
    line-height:1.25;
  }
  .note p{
    font-size:14px;
    line-height:1.55;
    color:var(--ink-soft);
    margin:0 0 14px;
    flex:1;
  }
  .note-foot{
    display:flex;
    justify-content:space-between;
    align-items:center;
    border-top:1px dashed var(--line);
    padding-top:10px;
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    color:#B7AD8E;
  }
  .note-foot .callno{color:var(--shelf-green); font-weight:600;}

  .empty{
    grid-column:1/-1;
    text-align:center;
    padding:60px 20px;
    color:#B7AD8E;
    font-family:'IBM Plex Mono',monospace;
    font-size:13px;
  }

  footer{
    text-align:center;
    padding:26px;
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    color:#B7AD8E;
    border-top:1px solid var(--line);
  }

  @media (max-width:520px){
    .card-count{text-align:left;}
    .plate-wrap{align-items:flex-start;}
  }
</style>
</head>
<body>

<header class="top">
  <div class="plate-wrap">
    <div>
      <span class="plate">Personal Catalog · Est. 2026</span>
      <h1 class="wordmark">Field <em>Notes</em></h1>
      <div class="tagline">notes, write-ups & things worth passing on</div>
    </div>
    <div class="card-count"><strong id="countNum">0</strong>cards on file</div>
  </div>
</header>

<nav class="drawers" id="drawers">
  <button class="tab active" data-cat="all">All Drawers</button>
  <button class="tab" data-cat="notes">Notes</button>
  <button class="tab" data-cat="knowledge">Knowledge Transfer</button>
  <button class="tab" data-cat="writing">Writing</button>
</nav>

<main>
  <div class="rail">
    <input id="search" type="text" placeholder="Search the catalog…">
    <span class="hint">title / tag / text</span>
  </div>

  <div class="grid" id="grid"></div>
</main>

<footer>Card catalog interface — edit the NOTES array in the script to add your own entries.</footer>

<script>
  // ---- Edit this array with your own content ----
  const NOTES = [
    {
      title: "Setting up a new laptop, without the pain",
      cat: "knowledge",
      tag: "onboarding",
      date: "2026-06-02",
      callno: "KT / 014",
      excerpt: "A checklist I wish I'd had on day one — accounts, dotfiles, the two settings everyone forgets to change."
    },
    {
      title: "Why we chose Postgres over Mongo (in the end)",
      cat: "knowledge",
      tag: "architecture",
      date: "2026-05-14",
      callno: "KT / 009",
      excerpt: "Not a takedown of document stores — just the specific constraints that tipped it for this project."
    },
    {
      title: "Reading notes: on writing clearly",
      cat: "notes",
      tag: "reading",
      date: "2026-04-30",
      callno: "N / 021",
      excerpt: "Three ideas from this month's reading that actually changed how I draft things."
    },
    {
      title: "Debugging a flaky CI pipeline",
      cat: "knowledge",
      tag: "devops",
      date: "2026-04-11",
      callno: "KT / 007",
      excerpt: "It wasn't the tests. It was never the tests. A short post-mortem for future me."
    },
    {
      title: "A short essay on slow mornings",
      cat: "writing",
      tag: "essay",
      date: "2026-03-22",
      callno: "W / 003",
      excerpt: "On the fifteen minutes before the day officially starts, and why I stopped skipping them."
    },
    {
      title: "Meeting notes → decisions template",
      cat: "notes",
      tag: "template",
      date: "2026-03-05",
      callno: "N / 015",
      excerpt: "The format that finally got people to stop re-litigating decisions two weeks later."
    },
  ];

  const grid = document.getElementById('grid');
  const countNum = document.getElementById('countNum');
  const search = document.getElementById('search');
  const tabs = document.querySelectorAll('.tab');
  let activeCat = 'all';

  function fmtDate(d){
    const dt = new Date(d + 'T00:00:00');
    return dt.toLocaleDateString('en-US', { month:'short', day:'numeric', year:'numeric' });
  }

  function render(){
    const q = search.value.trim().toLowerCase();
    const filtered = NOTES.filter(n=>{
      const matchesCat = activeCat === 'all' || n.cat === activeCat;
      const hay = (n.title + ' ' + n.tag + ' ' + n.excerpt).toLowerCase();
      const matchesQ = !q || hay.includes(q);
      return matchesCat && matchesQ;
    });

    grid.innerHTML = '';
    countNum.textContent = filtered.length;

    if(filtered.length === 0){
      grid.innerHTML = '<div class="empty">No cards match that search.</div>';
      return;
    }

    filtered.forEach(n=>{
      const el = document.createElement('div');
      el.className = 'note';
      el.innerHTML = `
        <div class="note-top">
          <span class="stamp">${n.tag}</span>
          <span class="date">${fmtDate(n.date)}</span>
        </div>
        <h3>${n.title}</h3>
        <p>${n.excerpt}</p>
        <div class="note-foot">
          <span class="callno">${n.callno}</span>
          <span>${n.cat}</span>
        </div>
      `;
      grid.appendChild(el);
    });
  }

  tabs.forEach(tab=>{
    tab.addEventListener('click', ()=>{
      tabs.forEach(t=>t.classList.remove('active'));
      tab.classList.add('active');
      activeCat = tab.dataset.cat;
      render();
    });
  });

  search.addEventListener('input', render);

  render();
</script>

</body>
</html>
